name: Frontend Deploy

# 운영 서버를 사용하지 않아 develop push 자동 배포를 껐다. 운영을 재개하면 아래 push 블록의 주석을 해제한다.
on:
  # push:
  #   paths:
  #     - 'Frontend/**'
  #     - '.github/workflows/frontend-deploy.yml'
  #   branches: ['develop']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version-file: Frontend/.nvmrc
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Install & Build React
        working-directory: Frontend
        run: |
          npm install
          CI='' npm run build

      - name: Copy Build Files to EC2 
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.FRONT_AWS_IP }}
          username: ${{ secrets.FRONT_USERNAME }}
          key: ${{ secrets.FRONT_AWS_KEY }}
          source: "Frontend/build"
          target: "/home/${{ secrets.FRONT_USERNAME }}/"

      - name: Restart Service
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.FRONT_AWS_IP }}
          username: ${{ secrets.FRONT_USERNAME }}
          key: ${{ secrets.FRONT_AWS_KEY }}
          script: |
            sudo systemctl reload nginx
            sudo systemctl status nginx
